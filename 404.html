<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Geopedia</title>
  <meta name="robots" content="noindex">
  <!-- Served for any missing path: send people to the map. The site lives
       under /geopedia/ on GitHub Pages and at the root on its own domain. -->
  <script>
    window.home = location.hostname.endsWith('github.io') ? '/geopedia/' : '/';
    const icon = Object.assign(document.createElement('link'), { rel: 'icon', type: 'image/svg+xml', href: home + 'favicon.svg' });
    document.head.append(icon);
    if (location.pathname !== home) setTimeout(() => location.replace(home), 3000);
  </script>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f7; color: #1d1d1f;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
    @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f5f5f7; } a { color: #4da3ff; } }
    h1 { font: 400 30px/1.2 Georgia, serif; font-variant: small-caps; margin: 0 0 8px; }
    a { color: #0a6fe0; }
  </style>
</head>
<body>
  <main>
    <h1>Geopedia</h1>
    <p>That page isn't on the map. <a id="home" href="/">Back to the map</a>.</p>
    <script>document.getElementById('home').href = home;</script>
  </main>
</body>
</html>
